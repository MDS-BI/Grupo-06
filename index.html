<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Adquisiciones y Compras</title>
  </head>
  <body>
    <div id="config-errors" class="config-error" role="alert" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <div class="brand">
          <span id="logo-mark" class="logo-mark" aria-hidden="true"></span>
          <span id="brand-name" class="brand-name">Adquisiciones y Compras</span>
        </div>

        <div class="topbar-rol">
          <label for="rol-activo">Rol Activo</label>
          <select id="rol-activo" class="rol-select" aria-label="Rol Activo">
            <option value="solicitante">Solicitante</option>
            <option value="comprador">Comprador</option>
            <option value="jefe_compras">Jefe de Compras</option>
            <option value="bodega">Encargado de Bodega</option>
            <option value="admin_ti">Administrador TI</option>
          </select>
        </div>
      </header>

      <aside class="sidebar">
        <nav class="side-nav" aria-label="Secciones de Adquisiciones y Compras">
          <button type="button" class="nav-module active" data-module="compras" id="nav-compras" aria-current="page">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l1.5 9h8.5l1.5-6H6"></path><circle cx="8" cy="16" r="1.2"></circle><circle cx="14" cy="16" r="1.2"></circle></svg>
            <span class="nav-label" id="nav-compras-label">Compras</span>
          </button>
        </nav>
      </aside>

      <main class="content" id="app">
        <section id="view-compras" aria-labelledby="compras-titulo">
          <div id="compras-root"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
